name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build EKA2L1 Android
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src/emu/android

    steps:
      - name: Download source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libc6-dev

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Android APK
        run: ./gradlew assembleRelease -PciArg='-DCI=ON'

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: EKA2L1-QinF22-Android
          path: src/emu/android/app/build/outputs/apk/release/app-release-unsigned.apk
